[package]
name = "construction"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.96"
axum = "0.8.1"
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.218", features = ["derive"] }
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.43.0", features = ["full"] }
